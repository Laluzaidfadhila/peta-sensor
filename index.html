<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Sebaran Sensor Stasiun Geofisika Kelas I Deli Serdang</title>
  
  <!-- CSS Leaflet.js -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin=""
  />

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
      color: #333;
    }

    #map {
      height: 650px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    /* Legend Badge Styles */
    .badge {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .badge-blue { background-color: #2A81CB; }
    .badge-red { background-color: #CB2B3E; }
    .badge-green { background-color: #2AAD27; }
    .badge-gold { background-color: #CACB2B; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Peta Sebaran Stasiun Monitoring BMKG</h2>
    <p>Gunakan kontrol layer di pojok kanan atas untuk menyaring tampilan jenis sensor.</p>

    <!-- Kontainer Peta -->
    <div id="map"></div>
  </div>

  <!-- JavaScript Leaflet.js -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin="">
  </script>

  <script>
    // 1. Inisialisasi Peta (Pusat Sumatra Utara)
    const map = L.map('map').setView([2.5, 99.2], 7);

    // 2. Tile Layer OpenStreetMap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 3. Ikon Marker Kustom Warna
    const blueIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const greenIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    const goldIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
    });

    // 4. Layer Groups
    const seismographGroup = L.layerGroup().addTo(map);
    const wrsngGroup = L.layerGroup().addTo(map);
    const accelerographGroup = L.layerGroup().addTo(map);
    const intensitymeterGroup = L.layerGroup().addTo(map);

    // --- DATA 1: Seismograph InaTEWS ---
    const dataSeismograph = [
      { id: "DDSI", lat: 1.603648, lng: 101.39128 },
      { id: "LASI", lat: 4.457253, lng: 97.970444 },
      { id: "LDSI", lat: 2.886174, lng: 98.15713 },
      { id: "MUTSI", lat: 2.300000, lng: 98.965000 },
      { id: "ONSM", lat: 2.159800, lng: 98.630000 },
      { id: "PLSM", lat: 1.057600, lng: 99.775900 },
      { id: "PMTSI", lat: 2.522983, lng: 99.261673 },
      { id: "PSI", lat: 2.695200, lng: 98.924000 },
      { id: "PTSM", lat: 2.011800, lng: 99.166000 },
      { id: "RLSI", lat: 2.068600, lng: 99.855300 },
      { id: "RSSM", lat: 2.598100, lng: 98.783200 },
      { id: "SBSI", lat: 1.398760, lng: 99.430900 },
      { id: "RSMSI", lat: 2.959140, lng: 98.861100 },
      { id: "TKSM", lat: 3.137400, lng: 98.324400 },
      { id: "TPRI", lat: 0.919300, lng: 104.520000 },
      { id: "TRSI", lat: 2.025560, lng: 98.959500 },
      { id: "TSI", lat: 3.501200, lng: 98.564500 }
    ];

    // --- DATA 2: WRSNG ---
    const dataWRSNG = [
      { nama: "WRS Kantor Bupati Humbang Hasundutan", lat: 2.250267, lng: 98.7904565 },
      { nama: "WRS Kantor Bupati Samosir", lat: 2.5598552, lng: 98.7223861 },
      { nama: "WRS Kantor Bupati Dairi", lat: 2.7479516, lng: 98.3139663 },
      { nama: "WRS Kantor Bupati Karo", lat: 3.1106594, lng: 98.5013393 },
      { nama: "WRS Kantor Bupati Tapanuli Utara", lat: 2.0217974, lng: 98.9617002 },
      { nama: "WRS Kantor Bupati Tapanuli Selatan", lat: 1.5178467, lng: 99.3011757 },
      { nama: "WRS Kantor Bupati Padang Lawas", lat: 1.0555997, lng: 99.7755672 },
      { nama: "WRS Kantor Bupati Labuhan Batu", lat: 2.0700841, lng: 99.857156 },
      { nama: "WRS Kantor BPBD Asahan", lat: 2.9814424, lng: 99.610221 },
      { nama: "WRS Stasiun Geofisika Deli Serdang", lat: 3.5006028, lng: 98.5655297 },
      { nama: "WRS Balai BMKG Wilayah I Medan", lat: 3.539705, lng: 98.6370872 },
      { nama: "WRS Pos SAR Parapat (Danau Toba)", lat: 2.6598046, lng: 98.9338025 },
      { nama: "WRS Kantor BPBD Provinsi Sumut", lat: 3.5999634, lng: 98.595761 },
      { nama: "WRS Kantor BPBD Tapanuli Tengah", lat: 1.6838945, lng: 98.8226437 },
      { nama: "WRS Kantor BPBD Pakpak Bharat", lat: 2.5401444, lng: 98.3214969 },
      { nama: "WRS Kantor BPBD Tapanuli Selatan", lat: 1.5159843, lng: 99.3000479 },
      { nama: "WRS Kantor BPBD Mandailing Natal", lat: 0.8225003, lng: 99.566365 },
      { nama: "WRS Kantor BPBD Sibolga", lat: 1.7401126, lng: 98.7757011 },
      { nama: "WRS Kantor BPBD Siantar", lat: 2.9517328, lng: 99.063362 },
      { nama: "WRS Kantor BPBD Simalungun", lat: 2.9614397, lng: 98.842142 }
    ];

    // --- DATA 3: Accelerograph ---
    const dataAccelerograph = [
      { id: "AUSN", lat: 3.26, lng: 98.53 },
      { id: "BUSN", lat: 3.59, lng: 98.51 },
      { id: "KNSN", lat: 3.60, lng: 98.86 },
      { id: "KUSN", lat: 3.12, lng: 98.51 },
      { id: "MEBA", lat: 3.79, lng: 98.71 },
      { id: "MEBW", lat: 3.54, lng: 98.67 },
      { id: "MEPA", lat: 2.70, lng: 98.92 },
      { id: "MESA", lat: 3.62, lng: 98.71 },
      { id: "PSSN", lat: 1.55, lng: 98.90 },
      { id: "PTSR", lat: 1.55, lng: 98.90 },
      { id: "PUSN", lat: 2.95, lng: 99.06 },
      { id: "SUSN", lat: 1.41, lng: 99.28 }
    ];

    // --- DATA 4: Intensitymeter ---
    const dataIntensitymeter = [
      { id: "NBMUS", lat: 3.54, lng: 98.64 },
      { id: "NKSUS", lat: 3.62, lng: 98.71 }
    ];

    // Render Seismograph (Pin Biru)
    dataSeismograph.forEach(item => {
      L.marker([item.lat, item.lng], { icon: blueIcon })
        .bindPopup(`<b>Seismograph InaTEWS</b><br>Kode: ${item.id}<br>Lat: ${item.lat}, Lng: ${item.lng}`)
        .addTo(seismographGroup);
    });

    // Render WRSNG (Pin Merah)
    dataWRSNG.forEach(item => {
      L.marker([item.lat, item.lng], { icon: redIcon })
        .bindPopup(`<b>WRSNG</b><br>${item.nama}<br>Lat: ${item.lat}, Lng: ${item.lng}`)
        .addTo(wrsngGroup);
    });

    // Render Accelerograph (Pin Hijau)
    dataAccelerograph.forEach(item => {
      L.marker([item.lat, item.lng], { icon: greenIcon })
        .bindPopup(`<b>Accelerograph</b><br>Kode: ${item.id}<br>Lat: ${item.lat}, Lng: ${item.lng}`)
        .addTo(accelerographGroup);
    });

    // Render Intensitymeter (Pin Kuning/Emas)
    dataIntensitymeter.forEach(item => {
      L.marker([item.lat, item.lng], { icon: goldIcon })
        .bindPopup(`<b>Intensitymeter</b><br>Kode: ${item.id}<br>Lat: ${item.lat}, Lng: ${item.lng}`)
        .addTo(intensitymeterGroup);
    });

    // 5. Kontrol Layer Peta
    const overlayMaps = {
      '<span class="badge badge-blue"></span> Shelter Seismograph InaTEWS': seismographGroup,
      '<span class="badge badge-red"></span> Lokasi WRSNG': wrsngGroup,
      '<span class="badge badge-green"></span> Accelerograph': accelerographGroup,
      '<span class="badge badge-gold"></span> Intensitymeter': intensitymeterGroup
    };

    L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
  </script>

</body>
</html>
